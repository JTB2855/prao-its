<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Customer support</title>
	<link rel="stylesheet" href="mvp.css">
	<style>
		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			text-align: center;
			color: #000;
		}

		main {
			width: min(100% - 2rem, 36rem);
		}

		button {
			width: 10rem;
			aspect-ratio: 1;
			padding: 1rem;
			border: 6px solid #8a0f14;
			border-radius: 50%;
			background: radial-gradient(circle at 35% 25%, #ff6868, #db1018 55%, #8c050a);
			color: white;
			font: inherit;
			font-weight: bold;
			cursor: pointer;
			box-shadow: 0 8px #65090c, 0 11px 18px #0003, inset 0 3px 4px #ffffff80;
		}

		button:active {
			transform: translateY(5px);
			box-shadow: 0 3px #65090c, inset 0 3px 4px #ffffff80;
		}

		button:disabled {
			border-color: #8a0f14;
			background: radial-gradient(circle at 35% 25%, #ff6868, #db1018 55%, #8c050a);
			color: white;
			cursor: default;
			opacity: 1;
		}

		#status {
			margin-top: 2rem;
			min-height: 5rem;
			font-family: monospace;
			font-size: 1.2rem;
		}

		.demo-notice {
			margin-top: 1.5rem;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main>
		<h1>Klicka för att nå customer support</h1>
		<button id="support-button" type="button">Customer support</button>
		<p id="status" aria-live="polite"></p>
	</main>
	<script>
		const supportButton = document.getElementById("support-button");
		const status = document.getElementById("status");
		const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
		const fargkombinationer = [
			{ bakgrund: "#7f1d1d", text: "#fff7ed" },
			{ bakgrund: "#1e3a8a", text: "#fef3c7" },
			{ bakgrund: "#14532d", text: "#fefce8" },
			{ bakgrund: "#4c1d95", text: "#fdf2f8" },
			{ bakgrund: "#164e63", text: "#ecfeff" }
		];
		let senasteFargindex = -1;

		function bytFarger() {
			let fargindex = Math.floor(Math.random() * fargkombinationer.length);

			while (fargindex === senasteFargindex) {
				fargindex = Math.floor(Math.random() * fargkombinationer.length);
			}

			senasteFargindex = fargindex;
			const farger = fargkombinationer[fargindex];
			document.body.style.backgroundColor = farger.bakgrund;
			document.body.style.color = farger.text;
		}

		supportButton.addEventListener("click", () => {
			const startSekunder = 10;
			let sekunderKvar = startSekunder;
			let fargbyteTimeout;
			supportButton.disabled = true;
			bytFarger();

			function planeraFargbyte() {
				if (prefersReducedMotion.matches || sekunderKvar === 0) {
					return;
				}

				const intervall = 400 + ((sekunderKvar - 1) / (startSekunder - 1)) * 600;
				fargbyteTimeout = setTimeout(() => {
					if (sekunderKvar === 0) {
						return;
					}

					bytFarger();
					planeraFargbyte();
				}, intervall);
			}

			planeraFargbyte();
			status.textContent = `Removing C:/System32... ${sekunderKvar} seconds left`;

			const nedrakning = setInterval(() => {
				sekunderKvar -= 1;

				if (sekunderKvar === 0) {
					clearInterval(nedrakning);
					clearTimeout(fargbyteTimeout);
					status.textContent = "Phew inget hände. Eller?";
					return;
				}

				status.textContent = `Removing C:/System32... ${sekunderKvar} seconds left`;
			}, 1000);
		});
	</script>
</body>
</html>
